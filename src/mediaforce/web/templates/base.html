<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - Mediaforce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/app.js"></script>
  </head>
  <body class="bg-surface text-foreground min-h-screen flex flex-col md:flex-row">
    <!-- Mobile Top Bar -->
    <nav class="md:hidden px-4 py-3 border-b border-surface-subtle bg-surface-subtle shadow-sm flex items-center justify-between z-20">
      <a href="/" class="flex items-center gap-2">
        <img src="/static/img/mediaforce-logo.svg" alt="Mediaforce" class="h-6 w-6" />
        <span class="text-lg font-semibold text-accent">Mediaforce</span>
      </a>
      <button id="mobileMenuBtn" class="p-2 text-foreground-muted hover:text-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobileMenu" class="hidden fixed inset-0 bg-surface/95 z-50 p-4 flex flex-col gap-4 md:hidden">
        <div class="flex justify-between items-center mb-4">
            <span class="font-bold text-xl">Menu</span>
            <button id="closeMobileMenu" class="p-2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <a href="/" class="text-lg py-2 border-b border-surface-subtle">Dashboard</a>
        <a href="/shows" class="text-lg py-2 border-b border-surface-subtle">Shows</a>
        <a href="/queue" class="text-lg py-2 border-b border-surface-subtle">Queue</a>
        <a href="/review" class="text-lg py-2 border-b border-surface-subtle">Review</a>
        <a href="/completed" class="text-lg py-2 border-b border-surface-subtle">Completed</a>
        <a href="/stats" class="text-lg py-2 border-b border-surface-subtle">Stats</a>
        <a href="/settings" class="text-lg py-2 border-b border-surface-subtle">Settings</a>
    </div>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-surface-subtle border-r border-surface-subtle h-screen sticky top-0 overflow-y-auto shrink-0">
      <div class="p-6 border-b border-surface-subtle/50">
        <a href="/" class="flex items-center gap-3">
          <img src="/static/img/mediaforce-logo.svg" alt="Mediaforce" class="h-8 w-8" />
          <span class="text-xl font-bold text-accent tracking-tight">Mediaforce</span>
        </a>
      </div>

      <nav class="flex-1 p-4 space-y-1">
        <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'dashboard' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            Dashboard
        </a>
        <a href="/shows" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'shows' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.8 19.8A2 2 0 0 1 17 22H7a2 2 0 0 1-2.8-2.2L6 18l-1.5-1.5A2 2 0 0 1 7 13h10a2 2 0 0 1 2.5 3.5L18 18l1.8 1.8z"/><path d="M12 13V2"/><line x1="12" y1="2" x2="8" y2="6"/><line x1="12" y1="2" x2="16" y2="6"/></svg>
            Shows
        </a>
        <a href="/queue" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'queue' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            Queue
        </a>
        <a href="/review" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'review' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            Review
        </a>
        <a href="/completed" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'completed' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Completed
        </a>
        <a href="/stats" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'stats' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Stats
        </a>
        <a href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ 'bg-surface-card text-foreground shadow-sm' if active == 'settings' else 'text-foreground-muted hover:bg-surface-card/50 hover:text-foreground' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            Settings
        </a>
      </nav>

      <div class="p-4 border-t border-surface-subtle/50 mt-auto">
        <form class="relative" action="/search" method="get">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-foreground-muted"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input
              type="text"
              name="q"
              placeholder="Search..."
              value="{{ request.query_params.get('q') if request and request.query_params else '' }}"
              class="w-full bg-surface-card border border-surface-subtle rounded-md py-2 pl-9 pr-3 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none"
            />
        </form>
        <div class="mt-4 flex items-center justify-between text-xs text-foreground-muted">
            <span>v0.3.0</span>
            <button id="themeToggle" type="button" class="hover:text-foreground">
                <span id="themeLabel">Dark</span> Mode
            </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8 overflow-x-hidden">
      {% block content %}{% endblock %}
    </main>

    <script>
      const btn = document.getElementById('mobileMenuBtn');
      const menu = document.getElementById('mobileMenu');
      const close = document.getElementById('closeMobileMenu');
      
      btn?.addEventListener('click', () => menu.classList.remove('hidden'));
      close?.addEventListener('click', () => menu.classList.add('hidden'));
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
