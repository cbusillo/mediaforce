<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - Mediaforce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script>
      (() => {
        const stored = localStorage.getItem("mf-theme");
        if (stored === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-foreground min-h-screen">
    <nav class="flex items-center gap-4 px-6 py-4 border-b border-accent/40 bg-surface-subtle shadow-sm">
      <a href="/" class="flex items-center gap-3">
        <img src="/static/img/mediaforce-logo.svg" alt="Mediaforce" class="h-8 w-8" />
        <span class="text-xl font-semibold text-accent">Mediaforce</span>
      </a>
      <div class="flex items-center gap-2 text-sm text-foreground-muted">
        <a
          href="/"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'dashboard' else '' }}"
          >Dashboard</a
        >
        <a
          href="/shows"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'shows' else '' }}"
          >Shows</a
        >
        <a
          href="/queue"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'queue' else '' }}"
          >Queue</a
        >
        <a
          href="/review"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'review' else '' }}"
          >Review</a
        >
        <a
          href="/completed"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'completed' else '' }}"
          >Completed</a
        >
        <a
          href="/settings"
          class="px-3 py-2 rounded-md hover:bg-surface-card {{ 'bg-surface-card text-foreground' if active == 'settings' else '' }}"
          >Settings</a
        >
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-3 text-sm text-foreground-muted">
        <div class="flex items-center gap-2">
          <button
            id="themeToggle"
            type="button"
            aria-label="Toggle dark mode"
            aria-pressed="true"
            class="px-3 py-1 rounded-full border border-foreground-muted hover:border-accent hover:text-accent"
          >
            <span id="themeLabel">Dark</span>
          </button>
        </div>
        <form
          class="flex items-center gap-2 bg-surface-card border border-surface-subtle rounded-full px-3 py-1"
          action="/search"
          method="get"
        >
          <input
            type="text"
            name="q"
            placeholder="Search files"
            value="{{ request.query_params.get('q') if request and request.query_params else '' }}"
            aria-label="Search files"
            class="bg-transparent border-none outline-none text-sm text-foreground placeholder:text-foreground-muted w-40"
          />
          <button type="submit" class="text-xs px-2 py-1 rounded-full bg-accent text-white hover:bg-accent-hover">
            Go
          </button>
        </form>
      </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
    <script>
      if (window.location.pathname === "/") {
        setTimeout(() => window.location.reload(), 30000);
      }

      (function () {
        const toggleBtn = document.getElementById("themeToggle");
        const label = document.getElementById("themeLabel");
        const setLabel = () =>
          (label.textContent = document.documentElement.classList.contains("dark") ? "Dark" : "Light");
        setLabel();
        toggleBtn?.addEventListener("click", () => {
          document.documentElement.classList.toggle("dark");
          const mode = document.documentElement.classList.contains("dark") ? "dark" : "light";
          localStorage.setItem("mf-theme", mode);
          toggleBtn.setAttribute("aria-pressed", mode === "dark");
          setLabel();
        });
        toggleBtn?.setAttribute("aria-pressed", document.documentElement.classList.contains("dark"));
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
