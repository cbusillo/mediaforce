[project]
name = "mediaforce"
version = "0.2.0"
description = "Content-aware media encoding with unified scheduling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "watchfiles",
    "sqlmodel",
]

[project.scripts]
mediaforce = "mediaforce:main"
mediaforce-web = "mediaforce_web:main"

[tool.uv]
dev-dependencies = [
    "mypy",
    "pytest",
    "ruff",
]
