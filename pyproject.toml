[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mediaforce"
version = "0.8.1"
description = "Manifest-driven AV1 planning and execution workflow for Mediaforce v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "sqlalchemy>=2.0.52,<3",
    "starlette>=1.6.0",
    "uvicorn",
    "hatchling",
    "truststore>=0.10.4,<0.11",
    "av>=19.0.2",
]

[project.scripts]
mediaforce = "mediaforce.cli:main"
mediaforce-web = "mediaforce.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["mediaforce"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/alembic.ini",
    "/mediaforce",
    "/pyproject.toml",
]
exclude = [
    "/**/.DS_Store",
    "/**/.idea",
    "/**/__pycache__",
    "/**/*.db",
    "/**/*.sqlite",
    "/**/*.sqlite3",
]

# The notarized app release: project.version is its version; the release workflow numbers the build from the live feed.
# public-key is the Sparkle EdDSA key every release ships.
[tool.mediaforce.release]
feed = "https://cbusillo.github.io/mediaforce/appcast.xml"
public-key = "rzpS2jLP0qsgpgYtvdu/lLrpv6ljcfy5zYhkkJAK5dg="

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ANN001", "ANN002", "ANN003", "ANN202", "PLW1514"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
