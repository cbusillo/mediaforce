[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mediaforce"
version = "0.1.0"
description = "Manifest-driven AV1 planning and execution workflow for Mediaforce v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
mediaforce = "mediaforce.cli:main"
mediaforce-web = "mediaforce.web.app:main"
media-harness = "mediaforce.cli:main"
media-harness-web = "mediaforce.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["mediaforce"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "mediaforce/web/frontend_build"
