[project]
name = "mediaforce"
version = "0.2.0"
description = "Content-aware media encoding with unified scheduling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "watchfiles",
    "sqlmodel",
]

[project.scripts]
mediaforce = "mediaforce.core:main"
mediaforce-web = "mediaforce.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mediaforce.web" = ["templates/*.html", "templates/**/*.html", "static/*"]

[tool.uv]
dev-dependencies = [
    "mypy",
    "pytest",
    "ruff",
]
