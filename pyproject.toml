[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mediaforce"
version = "0.1.0"
description = "Manifest-driven AV1 planning and execution workflow for Mediaforce v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "sqlalchemy>=2.0.51,<3",
    "starlette>=1.3.1",
    "uvicorn",
    "hatchling"
]

[project.scripts]
mediaforce = "mediaforce.cli:main"
mediaforce-web = "mediaforce.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["mediaforce"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "mediaforce/web/frontend_build"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/alembic.ini",
    "/frontend/.npmrc",
    "/frontend/.prettierignore",
    "/frontend/.prettierrc",
    "/frontend/eslint.config.js",
    "/frontend/package-lock.json",
    "/frontend/package.json",
    "/frontend/src",
    "/frontend/static",
    "/frontend/svelte.config.js",
    "/frontend/tsconfig.json",
    "/frontend/vite.config.ts",
    "/hatch_build.py",
    "/mediaforce",
    "/pyproject.toml",
]
exclude = [
    "/**/.DS_Store",
    "/**/.idea",
    "/**/__pycache__",
    "/**/*.db",
    "/**/*.sqlite",
    "/**/*.sqlite3",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ANN001", "ANN002", "ANN003", "ANN202"]
