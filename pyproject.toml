[project]
name = "mediaforce"
version = "0.2.0"
description = "Content-aware media encoding with unified scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "watchfiles>=0.24.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
mediaforce = "mediaforce:main"
mediaforce-web = "mediaforce_web:main"

[tool.uv]
dev-dependencies = [
    "mypy>=1.0.0",
    "pytest>=8.0.0",
]
