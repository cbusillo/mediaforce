[state]
db_path = "state/web-smoke/library.sqlite3"
run_manifest_dir = "state/web-smoke/runs"
web_state_dir = "state/web-smoke/web"
review_dir = "state/web-smoke/review"
runtime_settings_path = "state/web-smoke/runtime.json"

[state.cleanup]
transient_artifact_retention_days = 14
orphan_temp_retention_minutes = 10
periodic_sweep_minutes = 60

[media]
staging_root = "scratch/web-smoke/transcode"
archive_root = "scratch/web-smoke/transcode/_replaced"
output_container = "mkv"

[media.source_roots]
movies = "scratch/web-smoke/source/movies"
tv = "scratch/web-smoke/source/tv"

[video]
encoder = "libsvtav1"
pixel_format = "yuv420p10le"
preset = 4
crf_search = true
quality_metric = "vmaf"
target_vmaf = 85.0
target_xpsnr = 41.0
min_target_vmaf = 80.0
min_target_xpsnr = 35.0
target_size_mb = 300
target_size_bytes = 300000000
target_runtime_minutes = 45
size_goal_schema_version = 1
size_goal_mode = "normalized"
size_goal_source = "config_default"
sample_projection_tolerance_percent = 10
final_output_tolerance_percent = 5
decision_model = "size_first_review"
quality_engine = "ab_av1_fast_sample"
target_relax_step_vmaf = 0.5
target_relax_step_xpsnr = 1.0
sample_every = "8m"
sample_duration = "20s"
min_crf = 18
max_crf = 38
max_encoded_percent = 80
default_grain = 8
grain_denoise = 0
thorough = true
max_height = 1080
resolution_intent_mode = "max_height"
resolution_intent_source = "config_default"
downsample_algorithm = "lanczos"
black_bar_handling = "off"
black_bar_detect_samples = 3
black_bar_detect_seconds = 12
crop = ""

[audio]
keep_languages = ["eng"]
copy_codecs = ["aac", "opus"]
convert_to_opus_codecs = ["ac3", "eac3", "dts", "dtshd", "flac", "pcm_s16le", "pcm_s24le", "truehd"]
stereo_opus_bitrate = "128k"
surround_5_1_opus_bitrate = "256k"
surround_7_1_opus_bitrate = "320k"

[subtitle]
keep_languages = ["eng"]
prefer_text = true
keep_forced = true
default_mode = "first_english"

[planning]
default_limit = 20
size_weight = 10
large_file_gib = 4.0
large_file_bonus = 25
small_file_gib = 1.5
small_file_penalty = -15
multi_audio_bonus = 6
english_subtitle_bonus = 3
missing_english_audio_penalty = -30

[validation]
require_size_reduction = true

[planning.codec_bonus]
h264 = 40
hevc = 12
h265 = 12
av1 = -45
default = 18

[planning.bucket_thresholds]
priority_encode = 70
review_encode = 35

[[remote_hosts]]
key = "web-smoke-worker"
label = "Smoke Worker"
host = "web-smoke-worker.invalid"
mode = "ssh"
capabilities = ["encode_queue", "sample_calibration"]
priority = 10
max_parallel_encodes = 1
