# Folder-specific overrides live here so campaign tuning stays separate from the
# global defaults. Add one [[overrides]] block per folder prefix.

[[overrides]]
path_prefix = "tv/Suits"
note = "1080p BluRay drama with large H.264 + DTS seasons; good AV1 + Opus target."

[overrides.video]
default_grain = 0
target_xpsnr = 35.5
min_target_xpsnr = 34.5
max_encoded_percent = 55

[overrides.audio]
surround_5_1_opus_bitrate = "224k"

[overrides.planning]
extra_score = 18
small_file_penalty = -4

[[overrides]]
path_prefix = "tv/House/Season 5"
note = "Saved from the calibration bench."

[overrides.video]
crf_search = true
default_grain = 6
encoder = "libsvtav1"
grain_denoise = 0
max_crf = 38
max_encoded_percent = 10
min_crf = 18
min_target_vmaf = 83.0
min_target_xpsnr = 35.0
pixel_format = "yuv420p10le"
preset = 4
quality_metric = "vmaf"
sample_duration = "20s"
sample_every = "8m"
target_relax_step_vmaf = 0.5
target_relax_step_xpsnr = 1.0
target_vmaf = 85.0
target_xpsnr = 40.0
thorough = true

[overrides.audio]
convert_to_opus_codecs = ["ac3", "eac3", "dts", "dtshd", "flac", "pcm_s16le", "pcm_s24le", "truehd"]
copy_codecs = ["aac", "opus"]
keep_languages = ["eng"]
stereo_opus_bitrate = "128k"
surround_5_1_opus_bitrate = "224k"
surround_7_1_opus_bitrate = "320k"

[overrides.subtitle]
default_mode = "first_english"
keep_forced = true
keep_languages = ["eng"]
prefer_text = true

[overrides.planning]
bucket_thresholds = { priority_encode = 70, review_encode = 35 }
codec_bonus = { av1 = -45, default = 18, h264 = 40, h265 = 12, hevc = 12 }
default_limit = 20
english_subtitle_bonus = 3
large_file_bonus = 25
large_file_gib = 4.0
missing_english_audio_penalty = -30
multi_audio_bonus = 6
size_weight = 10
small_file_gib = 1.5
small_file_penalty = -8
