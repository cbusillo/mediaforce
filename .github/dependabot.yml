---
version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    groups:
      routine-version-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    groups:
      routine-version-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
