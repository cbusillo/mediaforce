---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:

permissions:
  contents: read

env:
  # Pull-request time budget for the acceptance lane. Exceeding it is reported
  # as a warning on the run, not a failure.
  ACCEPTANCE_BUDGET_MINUTES: "10"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - name: Decide whether product checks are needed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main always run everything. Pull requests that change
          # only docs/ or Markdown files (other than the packaged README.md)
          # skip the product lanes; a job skipped by its condition satisfies
          # required status checks.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          printf '%s\n' "$files"
          product=false
          if [ -z "$files" ]; then
            product=true
          fi
          while IFS= read -r path; do
            case "$path" in
              "") ;;
              README.md) product=true ;;
              docs/* | *.md) ;;
              *) product=true ;;
            esac
          done <<< "$files"
          echo "product=${product}" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: changes
    # Fail closed: run unless the change was positively classified docs-only.
    if: ${{ !cancelled() && needs.changes.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Record lane start
        run: echo "LANE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install browser smoke dependencies
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Install media tools
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends ffmpeg

      - name: Run backend tests
        run: uv run --with pytest pytest -q --durations=20

      - name: Run CLI smoke
        run: uv run mediaforce --help

      - name: Run frontend checks
        run: npm --prefix frontend run check

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build package archives
        run: uv build

      - name: Verify package contents
        run: >-
          uv run python scripts/verify_package_contents.py
          dist/*.whl dist/*.tar.gz

      - name: Run web route smoke
        env:
          MEDIAFORCE_WEB_REVIEW_ARTIFACTS: ${{ github.workspace }}/scratch/web-review
        run: npm --prefix frontend run smoke:web

      - name: Retain built frontend and synthetic review fixtures
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-review-${{ github.event.pull_request.head.sha }}
          path: |
            frontend/build/
            scratch/web-review/
          if-no-files-found: error
          retention-days: 3

      - name: Report time budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - LANE_STARTED_AT ))
          budget=$(( ACCEPTANCE_BUDGET_MINUTES * 60 ))
          echo "Acceptance lane took ${elapsed}s (budget ${budget}s)."
          if [ "$elapsed" -gt "$budget" ]; then
            echo "::warning title=CI time budget exceeded::Acceptance took ${elapsed}s; budget is ${budget}s."
          fi

  file-integrity-macos:
    name: file-integrity-macos
    needs: changes
    # Fail closed: run unless the change was positively classified docs-only.
    if: ${{ !cancelled() && needs.changes.outputs.product != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run macOS file-integrity and database-custody tests
        run: >-
          uv run --with pytest pytest -q
          tests/test_file_integrity.py
          tests/test_db_connection_custody.py
          tests/test_db_connection_checkpoint.py
          tests/test_db_runtime.py
