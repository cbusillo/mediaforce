---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install browser smoke dependencies
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Install media tools
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends ffmpeg

      - name: Run backend tests
        run: >-
          uv run --with pytest pytest -q
          -k "not test_bootstrap_remote_macos_returns_noop_when_no_bootstrap_issues
          and not test_bootstrap_remote_macos_routes_xcode_issue_to_request_helper
          and not test_remote_host_status_targets_current_machine_without_ssh_probe
          and not test_ffmpeg_hwaccel_included_when_videotoolbox_available"

      - name: Run CLI smoke
        run: uv run mediaforce --help

      - name: Run frontend checks
        run: npm --prefix frontend run check

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build package archives
        run: uv build

      - name: Verify package contents
        run: >-
          uv run python scripts/verify_package_contents.py
          dist/*.whl dist/*.tar.gz

      - name: Run web route smoke
        env:
          MEDIAFORCE_WEB_REVIEW_ARTIFACTS: scratch/web-review
        run: npm --prefix frontend run smoke:web

      - name: Retain built frontend and synthetic review fixtures
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-review-${{ github.event.pull_request.head.sha }}
          path: |
            frontend/build/
            scratch/web-review/
          if-no-files-found: error
          retention-days: 3

  file-integrity-macos:
    name: file-integrity-macos
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run macOS file-integrity tests
        run: uv run --with pytest pytest -q tests/test_file_integrity.py
