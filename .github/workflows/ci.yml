---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:

permissions:
  contents: read

env:
  # Pull-request time budget for the acceptance lane. Exceeding it is reported
  # as a warning on the run, not a failure.
  ACCEPTANCE_BUDGET_MINUTES: "10"

jobs:
  changes:
    runs-on: ubuntu-latest
    # Room for a merge-train pull request to wait on its push run.
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      product: ${{ steps.scope.outputs.product }}
      covered_by_push: ${{ steps.train.outputs.covered_by_push }}
    steps:
      # Only a same-repository launchplane/train/ pull request can defer to
      # its push run. The helper comes from the base commit, not the PR.
      - name: Check out the merge-train decision script
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'launchplane/train/') }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci_train_push_run.py
          sparse-checkout-cone-mode: false

      - name: Check whether a push run already covers this train candidate
        id: train
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'launchplane/train/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Below the job timeout, and above the 45-minute acceptance limit.
          PUSH_RUN_WAIT_MINUTES: "50"
        run: |
          # A merge-train candidate is pushed to launchplane/train/ (a full
          # push run on that commit) before its pull request opens. Only the
          # newest check of each name counts, so this run skips only after
          # that push run has passed; until then it waits. A failed push run,
          # a base without the helper, a failed lookup, or the deadline runs
          # the full suite.
          covered=false
          deadline=$(( $(date +%s) + PUSH_RUN_WAIT_MINUTES * 60 ))
          while [ -f scripts/ci_train_push_run.py ] &&
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${HEAD_SHA}&per_page=100")" &&
            state="$(printf '%s' "$runs" | python3 -I scripts/ci_train_push_run.py \
              --repository "$GITHUB_REPOSITORY" \
              --head-repository "$HEAD_REPOSITORY" \
              --head-ref "$HEAD_REF" \
              --head-sha "$HEAD_SHA" \
              --workflow-path .github/workflows/ci.yml)"; do
            if [ "$state" = "passed" ]; then
              covered=true
              break
            fi
            if [ "$state" != "running" ] || [ "$(date +%s)" -ge "$deadline" ]; then
              break
            fi
            sleep 30
          done
          echo "covered_by_push=${covered}" >> "$GITHUB_OUTPUT"
          if [ "$covered" = "true" ]; then
            echo "The push run on ${HEAD_SHA} passed; product lanes skip here." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide whether product checks are needed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Pushes to main always run everything. Pull requests that change
          # only docs/ or Markdown files (other than the packaged README.md)
          # skip the product lanes; a job skipped by its condition satisfies
          # required status checks. A merge-train pull request never takes
          # the docs-only skip: its newer skipped checks would hide a failed
          # push run on the same commit.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            case "$HEAD_REF" in
              launchplane/train/*)
                echo "product=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          printf '%s\n' "$files"
          product=false
          if [ -z "$files" ]; then
            product=true
          fi
          while IFS= read -r path; do
            case "$path" in
              "") ;;
              README.md) product=true ;;
              docs/* | *.md) ;;
              *) product=true ;;
            esac
          done <<< "$files"
          echo "product=${product}" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: changes
    # Fail closed: run unless the change was positively classified docs-only.
    # A merge-train pull request skips when its push run covers the commit.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.product != 'false' &&
      needs.changes.outputs.covered_by_push != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Last September build: upstream retains monthly builds for two years.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
    steps:
      - name: Record lane start
        run: echo "LANE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install browser smoke dependencies
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Restore media tools archive
        id: media-tools-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/media-tools/ffmpeg.tar.xz
          key: media-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_SHA256 }}

      - name: Install media tools
        timeout-minutes: 5
        run: |
          started_at=$(date +%s)
          tools_dir="${RUNNER_TEMP}/media-tools"
          archive="${tools_dir}/ffmpeg.tar.xz"
          mkdir -p "$tools_dir"
          if [ ! -f "$archive" ]; then
            curl --fail --location --show-error \
              --connect-timeout 15 --max-time 60 \
              --retry 2 --retry-max-time 120 \
              "$FFMPEG_URL" --output "$archive"
          fi
          # Verify cache hits too, before unpacking or executing anything.
          printf '%s  %s\n' "$FFMPEG_SHA256" "$archive" | sha256sum --check --strict
          archive_root="${FFMPEG_URL##*/}"
          archive_root="${archive_root%.tar.xz}"
          tar -xJf "$archive" --directory "$tools_dir" --strip-components=1 \
            "${archive_root}/bin/ffmpeg" "${archive_root}/bin/ffprobe"
          "${tools_dir}/bin/ffmpeg" -version
          "${tools_dir}/bin/ffprobe" -version
          echo "${tools_dir}/bin" >> "$GITHUB_PATH"
          elapsed=$(( $(date +%s) - started_at ))
          echo "Media tools installed in ${elapsed}s."
          echo "Media tools install: ${elapsed}s (cache hit: ${{ steps.media-tools-cache.outputs.cache-hit }})." >> "$GITHUB_STEP_SUMMARY"

      - name: Run backend tests
        run: uv run --with pytest pytest -q --durations=20

      - name: Run CLI smoke
        run: uv run mediaforce --help

      - name: Run frontend checks
        run: npm --prefix frontend run check

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build package archives
        run: uv build

      - name: Verify package contents
        run: >-
          uv run python scripts/verify_package_contents.py
          dist/*.whl dist/*.tar.gz

      - name: Run web route smoke
        env:
          MEDIAFORCE_WEB_REVIEW_ARTIFACTS: ${{ github.workspace }}/scratch/web-review
        run: npm --prefix frontend run smoke:web

      - name: Retain built frontend and synthetic review fixtures
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-review-${{ github.event.pull_request.head.sha }}
          path: |
            frontend/build/
            scratch/web-review/
          if-no-files-found: error
          retention-days: 3

      - name: Report time budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - LANE_STARTED_AT ))
          budget=$(( ACCEPTANCE_BUDGET_MINUTES * 60 ))
          echo "Acceptance lane took ${elapsed}s (budget ${budget}s)."
          if [ "$elapsed" -gt "$budget" ]; then
            echo "::warning title=CI time budget exceeded::Acceptance took ${elapsed}s; budget is ${budget}s."
          fi

  file-integrity-macos:
    name: file-integrity-macos
    needs: changes
    # Fail closed: run unless the change was positively classified docs-only.
    # A merge-train pull request skips when its push run covers the commit.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.product != 'false' &&
      needs.changes.outputs.covered_by_push != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harden Python installation permissions
        run: |
          python_prefix="$(python -I -S -c 'import sys; print(sys.base_prefix)')"
          sudo chmod -R go-w "$python_prefix"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run macOS file-integrity and database-custody tests
        run: >-
          uv run --with pytest pytest -q
          tests/test_file_integrity.py
          tests/test_db_connection_custody.py
          tests/test_db_connection_checkpoint.py
          tests/test_db_runtime.py
