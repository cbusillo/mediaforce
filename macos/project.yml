---
name: Mediaforce
options:
  bundleIdPrefix: com.shinycomputers
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Mediaforce:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mediaforce
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: Generated/Mediaforce-Info.plist
      properties:
        CFBundleDisplayName: Mediaforce
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Release builds name the signed feed and its public key; a source build leaves both empty and never checks.
        SUFeedURL: $(MEDIAFORCE_UPDATE_FEED)
        SUPublicEDKey: $(MEDIAFORCE_UPDATE_KEY)
        SUEnableAutomaticChecks: true
        # Mediaforce gets ready first, then asks before installing.
        SUAllowsAutomaticUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.mediaforce
        PRODUCT_NAME: Mediaforce
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        MEDIAFORCE_UPDATE_FEED: ""
        MEDIAFORCE_UPDATE_KEY: ""

  MediaforceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MediaforceTests
      - path: ../tests/fixtures/original-confirmation.json
        buildPhase: resources
      - path: ../tests/fixtures/original-dismissal.json
        buildPhase: resources
    dependencies:
      - target: Mediaforce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.mediaforce.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Mediaforce:
    build:
      targets:
        Mediaforce: all
    test:
      targets:
        - MediaforceTests
